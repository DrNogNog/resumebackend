# -------------------------
# HTTP (port 80) - Redirect API subdomain to HTTPS, close others
# -------------------------
server {
    listen 80;
    server_name api.resumesub.xyz;
    return 301 https://$server_name$request_uri;
}

server {
    listen 80 default_server;
    server_name _;
    return 444;
}

# -------------------------
# HTTPS (port 443) - Main site (resumesub.xyz + www)
# -------------------------
server {
    listen 443 ssl;
    server_name resumesub.xyz www.resumesub.xyz;

    # Use appropriate cert for main site here (or redirect to API if no separate cert)
    # ssl_certificate /etc/letsencrypt/live/resumesub.xyz/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/resumesub.xyz/privkey.pem;

    # If no separate cert/site yet, just redirect to API subdomain or return 444
    return 301 https://api.resumesub.xyz$request_uri;
}

# -------------------------
# HTTPS (port 443) - API subdomain with HTTP/2
# -------------------------
server {
    listen 443 ssl http2;
    server_name api.resumesub.xyz;

    ssl_certificate /etc/letsencrypt/live/api.resumesub.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.resumesub.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Increase body size for any potential larger POSTs (e.g., future file uploads)
    client_max_body_size 10M;

    location / {
        proxy_pass http://api:8000/;  # Your Docker service name

        # Essential proxy headers for ASGI + HTTP/2
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Stream request body (fixes POST body issues over HTTP/2)
        proxy_request_buffering off;

        # Dynamic CORS - reflects Origin safely, works for all methods including OPTIONS
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-API-Key" always;
        add_header Vary Origin always;

        # Handle preflight OPTIONS directly (fast 204 response)
        if ($request_method = OPTIONS) {
            add_header Content-Length 0 always;
            add_header Content-Type text/plain always;
            return 204;
        }
    }
}

# Default HTTPS catch-all
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate /etc/letsencrypt/live/api.resumesub.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.resumesub.xyz/privkey.pem;
    return 444;
}