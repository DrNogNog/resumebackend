# -------------------------
# HTTP (port 80) - Redirect API subdomain to HTTPS, close others
# -------------------------
server {
    listen 80;
    server_name api.resumesub.xyz;
    return 301 https://$server_name$request_uri;
}

server {
    listen 80 default_server;
    server_name _;
    return 444;
}

# -------------------------
# HTTPS (port 443) - Main site (resumesub.xyz + www)
# -------------------------
server {
    listen 443 ssl;
    server_name resumesub.xyz www.resumesub.xyz;

    # Use appropriate cert for main site here (or redirect to API if no separate cert)
    # ssl_certificate /etc/letsencrypt/live/resumesub.xyz/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/resumesub.xyz/privkey.pem;

    # If no separate cert/site yet, just redirect to API subdomain or return 444
    return 301 https://api.resumesub.xyz$request_uri;
}

# -------------------------
# HTTPS (port 443) - API subdomain with HTTP/2
# -------------------------
server {
    listen 443 ssl http2;
    server_name api.resumesub.xyz;

    ssl_certificate /etc/letsencrypt/live/api.resumesub.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.resumesub.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Increase body size for any potential larger POSTs (e.g., future file uploads)
    client_max_body_size 10M;

    location / {
    proxy_pass http://api:8000/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;

    # CORS headers
    add_header 'Access-Control-Allow-Origin' 'https://www.resumesub.xyz' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Authorization,Content-Type' always;

    # Preflight OPTIONS
    if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Max-Age' 1728000;
        add_header 'Content-Type' 'text/plain charset=UTF-8';
        add_header 'Content-Length' 0;
        return 204;
    }

    # Timeouts
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    send_timeout 300s;
}

}

# Default HTTPS catch-all
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate /etc/letsencrypt/live/api.resumesub.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.resumesub.xyz/privkey.pem;
    return 444;
}