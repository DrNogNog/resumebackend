# -------------------------
# HTTP (port 80)
# -------------------------
server {
    listen 80;
    server_name resumesub.xyz www.resumesub.xyz;

    # ✅ Handle CORS preflight BEFORE redirect
    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin https://www.resumesub.xyz;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-API-Key";
        add_header Access-Control-Allow-Credentials true;
        add_header Content-Length 0;
        add_header Content-Type text/plain;
        return 204;
    }

    # Redirect everything else to HTTPS
    return 301 https://$host$request_uri;
}

# -------------------------
# HTTPS (port 443)
# -------------------------
server {
    listen 443 ssl;
    server_name resumesub.xyz www.resumesub.xyz;

    # SSL certificates
    ssl_certificate /etc/letsencrypt/live/resumesub.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/resumesub.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # ✅ Handle CORS preflight WITHOUT proxy or redirect
    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin https://www.resumesub.xyz;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-API-Key";
        add_header Access-Control-Allow-Credentials true;
        add_header Content-Length 0;
        add_header Content-Type text/plain;
        return 204;
    }

    # Proxy API requests to FastAPI
    location /api/ {
        proxy_pass http://api:8000;  # no trailing slash
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_redirect off;
    }

    # Serve uploaded build files if needed
    location /build/ {
        alias /app/build/;
        autoindex off;
    }

    # Default 404
    location / {
        return 404;
    }
}
