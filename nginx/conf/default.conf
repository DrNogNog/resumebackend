# -------------------------
# HTTP (port 80) - Redirect to HTTPS for API subdomain only
# -------------------------
server {
    listen 80;
    server_name api.resumesub.xyz;

    # Redirect all HTTP traffic to HTTPS
    return 301 https://$server_name$request_uri;
}

# Optional: Catch-all for other HTTP traffic (close connection silently)
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

# -------------------------
# HTTPS (port 443) - API only
# -------------------------
server {
    listen 443 ssl;
    http2 on;  # Modern syntax (fixes deprecation warning)
    server_name api.resumesub.xyz;

    # Correct certificate paths (the ones you copied as real files)
    ssl_certificate /etc/letsencrypt/live/api.resumesub.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.resumesub.xyz/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Proxy everything at root to FastAPI (cleanest for /api prefixed routes)
    location / {
        proxy_pass http://api:8000/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Handle preflight OPTIONS directly in Nginx
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "https://www.resumesub.xyz" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-API-Key" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Content-Length 0;
            return 204;
        }

        # Regular CORS headers
        add_header Access-Control-Allow-Origin "https://www.resumesub.xyz" always;
        add_header Access-Control-Allow-Credentials "true" always;
    }
}

# Optional: Default HTTPS catch-all (close connection for non-API domains)
server {
    listen 443 ssl default_server;
    server_name _;
    ssl_certificate /etc/letsencrypt/live/api.resumesub.xyz/fullchain.pem;  # Dummy cert to satisfy SSL
    ssl_certificate_key /etc/letsencrypt/live/api.resumesub.xyz/privkey.pem;
    return 444;
}