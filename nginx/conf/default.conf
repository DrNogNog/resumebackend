# -------------------------
# HTTP (port 80) - Redirect to HTTPS
# -------------------------
server {
    listen 80;
    server_name resumesub.xyz www.resumesub.xyz api.resumesub.xyz;

    # Redirect everything to HTTPS
    return 301 https://$host$request_uri;
}

# -------------------------
# HTTPS (port 443) - Frontend
# -------------------------
server {
    listen 443 ssl http2;
    server_name resumesub.xyz www.resumesub.xyz;

    ssl_certificate /etc/letsencrypt/live/resumesub.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/resumesub.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Serve frontend build
    location /build/ {
        alias /app/build/;
        autoindex off;
    }

    # Default 404 for everything else
    location / {
        return 404;
    }
}

# -------------------------
# HTTPS (port 443) - API
# -------------------------
server {
    listen 443 ssl http2;
    server_name api.resumesub.xyz;

    ssl_certificate /etc/letsencrypt/live/resumesub.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/resumesub.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Global CORS headers for API
    add_header Access-Control-Allow-Origin "https://www.resumesub.xyz" always;
    add_header Access-Control-Allow-Credentials "true" always;

    # Handle CORS preflight for OPTIONS
    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin "https://www.resumesub.xyz";
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-API-Key";
        add_header Access-Control-Allow-Credentials "true";
        add_header Content-Length 0;
        add_header Content-Type "text/plain";
        return 204;
    }

    # Proxy API requests to FastAPI
    location /api/ {
        proxy_pass http://api:8000;  # Your FastAPI container
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_redirect off;
    }
}
