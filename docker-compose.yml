version: "3.8"

services:
  nginx:
    image: nginx:stable
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf:/etc/nginx/conf.d
      - ./certs:/etc/letsencrypt
      - uploads:/app/build
    depends_on:
      - api

  api:
    build:
      context: ./Resume Builder
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - ENV=production
      - TEX_BIN=xelatex
    volumes:
      - uploads:/app/build
    expose:
      - "8000"

volumes:
  uploads:
