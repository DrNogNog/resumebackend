version: "3.8"

services:
  nginx:
    image: nginx:stable
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf:/etc/nginx/conf.d
      - ./certs:/etc/letsencrypt
      - uploads:/app/build
    depends_on:
      - api

  api:
    build:
      context: ./Resume Builder
      dockerfile: Dockerfile

    env_file:
      - .env        # <-- THIS is what loads everything

    environment:
      - ENV=production
      - TEX_BIN=/usr/bin/xelatex   # override or ensure

    volumes:
      - uploads:/app/build
    expose:
      - "8000"

volumes:
  uploads:
