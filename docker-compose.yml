version: "3.8"

services:
  nginx:
    image: nginx:stable
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf:/etc/nginx/conf.d
      - ./certs:/etc/letsencrypt
      - uploads:/app/build
    depends_on:
      - api
    networks:
      - backend

  api:
    build:
      context: ./Resume Builder
      dockerfile: Dockerfile
    container_name: resumebackend-api-1
    env_file:
      - ./Resume Builder/.env
    environment:
      ENV: production
      TEX_BIN: xelatex
      DATABASE_URL: postgresql+asyncpg://postgres:1234@db:5432/resumes
    expose:
      - "8000"
    depends_on:
      - db
    networks:
      - backend

  db:
    image: postgres:15
    container_name: resume-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: resumes
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend

volumes:
  uploads:
  pgdata:

networks:
  backend:
    driver: bridge
