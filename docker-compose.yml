version: "3.9"

services:
  nginx:
    image: nginx:stable
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf:/etc/nginx/conf.d:ro
      - ./certs:/etc/letsencrypt:ro
      - uploads:/app/uploads
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - backend

  api:
    build:
      context: ./Resume Builder
      dockerfile: Dockerfile
    container_name: resumebackend-api-1
    volumes:
      - ./Resume Builder:/app
    env_file:
      - ./Resume Builder/.env
    environment:
      ENV: production
      TEX_BIN: xelatex
      DATABASE_URL: postgresql+asyncpg://postgres:1234@resume-postgres:5432/resume_builder
      ALEMBIC_SQLALCHEMY_URL: postgresql+pg8000://postgres:1234@resume-postgres:5432/resume_builder
      SECRET_KEY: Pinky3Panda03)
      OLLAMA_BASE_URL: http://ollama:11434  # <-- updated for container network
    expose:
      - "8000"
    depends_on:
      - resume-postgres
      - ollama   # <-- ensure backend waits for Ollama
    restart: unless-stopped
    networks:
      - backend

  resume-postgres:
    image: postgres:15
    container_name: resume-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: resume_builder
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - backend

  ollama:
    image: ollama/ollama
    container_name: ollama
    ports:
      - "11434:11434"  # host port mapping
    restart: unless-stopped
    networks:
      - backend

volumes:
  uploads:
  pgdata:

networks:
  backend:
    driver: bridge
