version: "3.9"

services:
  # Ollama service removed - using OpenAI (hosted) instead. Ensure
  # OPENAI_API_KEY is set in your environment or in ./Resume Builder/.env

  resume-postgres:
    image: postgres:15
    container_name: resume-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: resume_builder
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend
    restart: unless-stopped

  api:
    build:
      context: ./Resume Builder
      dockerfile: Dockerfile
    container_name: resumebackend-api-1
    volumes:
      - ./Resume Builder:/app
    env_file:
      - ./Resume Builder/.env
    environment:
      ENV: production
      DATABASE_URL: postgresql+asyncpg://postgres:1234@resume-postgres:5432/resume_builder
      ALEMBIC_SQLALCHEMY_URL: postgresql+pg8000://postgres:1234@resume-postgres:5432/resume_builder
      TEX_BIN: xelatex
      SECRET_KEY: Pinky3Panda03)
      # OpenAI configuration - set these in your .env or environment
      # OPENAI_API_KEY is required; OPENAI_API_BASE and OPENAI_MODEL are optional
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-https://api.openai.com}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-3.5-turbo}
    expose:
      - "8000"
    depends_on:
      - resume-postgres
    networks:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:stable
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf:/etc/nginx/conf.d:ro
      - ./certs:/etc/letsencrypt:ro
      - uploads:/app/uploads
    depends_on:
      - api
    networks:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  uploads:

networks:
  backend:
    driver: bridge
