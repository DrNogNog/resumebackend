version: "3.8"

services:
  nginx:
    image: nginx:stable
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf:/etc/nginx/conf.d
      - ./certs:/etc/letsencrypt
      - uploads:/app/build
    depends_on:
      - api
    networks:
      - backend

  api:
    build:
      context: ./Resume Builder
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - ENV=production
      - TEX_BIN=xelatex
    volumes:
      - uploads:/app/build
    expose:
      - "8000"
    networks:
      - backend

volumes:
  uploads:

networks:
  backend:
    driver: bridge
